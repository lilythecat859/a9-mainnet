[package]
name = "a9-node"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
libp2p = { version = "0.53", features = ["quic", "tokio", "gossipsub", "dns"] }
blake3 = "1.5"
ark-ff = "0.4"
ark-ec = "0.4"
ark-poly = "0.4"
ark-stark = { git = "https://github.com/arkworks-rs/stark" }
rocksdb = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
chrono = "0.4"
futures = "0.3"
tokio-util = "0.7"
bytes = "1"
smallvec = "1.13"
